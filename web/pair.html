<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>PocketDesk 手机连接</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea;
    --accent: #0a7aff; --ok: #1f9d55; --danger: #d70015;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --fg: #f5f5f7; --muted: #98989f; --line: #2c2c2e;
            --accent: #0a84ff; --ok: #30d158; --danger: #ff453a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .qr-row { display: flex; flex-wrap: wrap; gap: 20px; }
  .qr { flex: 1 1 240px; text-align: center; }
  .qr .img { width: 220px; height: 220px; margin: 0 auto 8px; border-radius: 8px; overflow: hidden; background: #fff; }
  .qr .img svg { width: 100%; height: 100%; display: block; }
  .qr .ip { font-weight: 600; }
  .qr .url { color: var(--muted); font-size: 12px; word-break: break-all; }
  ol { margin: 0; padding-left: 20px; }
  li { margin-bottom: 6px; }
  #paired { color: var(--ok); font-weight: 600; min-height: 1.5em; }
  .code-box { text-align: center; margin: 18px 0 6px; }
  .code-box .label { color: var(--muted); }
  .code { font-size: 44px; font-weight: 700; letter-spacing: 0.18em; font-variant-numeric: tabular-nums; }
  #expires { color: var(--muted); font-size: 13px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 10px 4px; border-top: 1px solid var(--line); }
  td.when { color: var(--muted); font-size: 13px; }
  td.act { text-align: right; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
           background: transparent; color: var(--danger); cursor: pointer; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>手机连接</h1>
  <p class="sub">用 iPhone 相机扫描二维码，按提示操作。手机需要和这台电脑在同一个局域网。</p>

  <div class="card">
    <div class="qr-row" id="qrs"></div>
    <div class="code-box">
      <div class="label">或者在 PocketDesk 页面里点“添加电脑”，输入这台电脑（<span id="pc-name"></span>）的数字：</div>
      <div id="short-code" class="code"></div>
    </div>
    <p id="expires"></p>
    <p id="paired"></p>
    <ol>
      <li>第一次连接时，手机会提示下载并信任这台电脑的证书（每部手机只需一次）。</li>
      <li>二维码和数字只能用一次，10 分钟内有效；用过、过期或输错 5 次后会自动换新的。</li>
      <li>授权一直有效，除非在下面“已授权的手机”里移除。</li>
      <li>有多个地址时，扫手机所在网络的那一个（通常是 192.168 开头的）。</li>
    </ol>
  </div>

  <div class="card">
    <h2>已授权的手机</h2>
    <table><tbody id="devices"></tbody></table>
  </div>
</main>
<script>
  const fmtTime = (s) => s ? new Date(s * 1000).toLocaleString('zh-CN', { hour12: false }) : '—';
  let lastKey = '';

  async function refresh() {
    let d;
    try { d = await (await fetch('/api/local/pair', { cache: 'no-store' })).json(); } catch { return; }
    const key = d.urls.map((u) => u.url).join('|');
    if (key !== lastKey) {
      lastKey = key;
      const box = document.getElementById('qrs');
      box.innerHTML = '';
      for (const u of d.urls) {
        const el = document.createElement('div');
        el.className = 'qr';
        el.innerHTML = `<div class="img">${u.svg}</div><div class="ip"></div><div class="url"></div>`;
        el.querySelector('.ip').textContent = u.ip;
        el.querySelector('.url').textContent = u.url;
        box.appendChild(el);
      }
      if (!d.urls.length) box.textContent = '没有找到局域网地址，请检查网络连接。';
    }
    document.getElementById('short-code').textContent = d.shortCode.slice(0, 3) + ' ' + d.shortCode.slice(3);
    document.getElementById('pc-name').textContent = d.pcName;
    const m = Math.floor(d.secondsLeft / 60);
    document.getElementById('expires').textContent = `二维码还有 ${m} 分 ${d.secondsLeft % 60} 秒过期`;
    document.getElementById('paired').textContent = d.lastPaired ? `✓ 刚刚授权了：${d.lastPaired}` : '';

    const tbody = document.getElementById('devices');
    tbody.innerHTML = '';
    if (!d.devices.length) {
      tbody.innerHTML = '<tr><td class="empty">还没有手机。</td></tr>';
    }
    for (const dev of d.devices) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="name"></td><td class="when"></td><td class="act"><button type="button">移除</button></td>';
      tr.querySelector('.name').textContent = dev.name;
      tr.querySelector('.when').textContent = `最近使用 ${fmtTime(dev.lastSeen)}` +
        (dev.ip ? ` · ${dev.ip}` : '') + (dev.browsers > 1 ? ` · ${dev.browsers} 个浏览器` : '');
      tr.querySelector('button').addEventListener('click', async () => {
        if (!confirm(`移除“${dev.name}”？它需要重新扫码才能连接。`)) return;
        await fetch('/api/local/devices/remove', { method: 'POST', body: JSON.stringify({ id: dev.id }) });
        refresh();
      });
      tbody.appendChild(tr);
    }
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
